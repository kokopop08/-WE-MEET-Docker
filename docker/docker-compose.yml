version: '3.8'

networks:
  babyray-net:
    external: true

volumes:
  babyray-data:
    name: babyray-data

services:
  # GCS 및 Q-learning 스케줄러를 구동하는 Head 관리 노드
  head:
    build:
      context: ..
      dockerfile: docker/Dockerfile.head
    image: babyray-head-image:latest
    container_name: babyray-head
    command: python -m wemeet.transport.head
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # 호스트 Docker 데몬 연동
      - ../data:/app/data # 공유 데이터 호스트 디렉토리 마운트 (q_table.json 포함)
      - ../wemeet/learning:/app/wemeet/learning # 학습 코드 호스트 실시간 동기화 마운트(구 head/q_learning)
    ports:
      - "50051:50051" # gRPC 포트
      - "8080:8080" # 모니터링 대시보드 포트 추가
    networks:
      - babyray-net
    environment:
      - NODE_TYPE=head
      - PYTHONUNBUFFERED=1
      # 실험 제어(오케스트레이터/호스트 env 에서 주입). 미지정 시 평상시 기본값.
      - SCHEDULER_MODE=${SCHEDULER_MODE:-dynamic}
      - Q_LEARNING_TRAINING_MODE=${Q_LEARNING_TRAINING_MODE:-true}
      - EXPERIMENT_AUTOEXIT=${EXPERIMENT_AUTOEXIT:-0}
      - INITIAL_VIRTUAL_BUDGET=${INITIAL_VIRTUAL_BUDGET:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  # On-Demand 노드 (2 Cores, 2GB Memory, GPU 1.0 배율)
  worker-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: babyray-worker-image:latest
    container_name: babyray-on-demand
    depends_on:
      - head
    command: python -m wemeet.transport.worker --id worker-1 --type on_demand --port 50052
    volumes:
      - ../data:/app/data # 공유 데이터 호스트 디렉토리 마운트
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    networks:
      - babyray-net
    environment:
      - NODE_TYPE=on_demand
      - HEAD_HOST=head
      - HEAD_PORT=50051
      - PYTHONUNBUFFERED=1
      - CUDA_MPS_ACTIVE_THREAD_PERCENTAGE=100
  # 도커 컨테이너를 실행(Run)하는 시점에 cluster_manager.py가 인자값과 
